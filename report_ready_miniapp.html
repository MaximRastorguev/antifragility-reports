<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; background: #f8f9fa; font-family: -apple-system, sans-serif; }

    /* 1. Контейнер: занимает всё место над меню, служит "якорем" */
    .content-wrapper {
        height: calc(100vh - 70px);
        width: 100%;
        position: relative; /* Важно для центрирования детей */
    }

    /* 2. Слайд: Строго по центру, 16:9 */
    .slide {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%); /* Магия: ставит центр слайда в центр экрана */
        
        width: 100%;             /* Занимает всю ширину */
        aspect-ratio: 16 / 9;    /* Высота автоматически становится 56% от ширины */
        
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
        overflow: hidden;
    }
        .slide-tall {
        aspect-ratio: 16 / 11;
    }

    .slide.active {
        opacity: 1;
        pointer-events: auto;
        z-index: 10;
    }

    /* 3. График растягивается на весь белый блок */
    .js-plotly-plot, .plotly { width: 100% !important; height: 100% !important; }

    /* 4. Стили навигации (без изменений) */
    .top-nav {
        position: fixed; bottom: 0; left: 0; width: 100%; height: 70px;
        background: #fff; z-index: 2000;
        display: flex; justify-content: space-around; align-items: center;
        box-shadow: 0 -2px 12px rgba(0,0,0,0.05);
    }
    .nav-item {
        flex: 1; max-width: 80px; height: 60px; background: #f3f4f6;
        border-radius: 14px; display: flex; flex-direction: column;
        align-items: center; justify-content: center; cursor: pointer;
        transition: all 0.2s ease; border: 2px solid transparent;
        user-select: none; touch-action: manipulation;
    }
    .nav-item.active {
        background: #fff; color: #3b82f6; border-color: #3b82f6;
        transform: scale(1.05); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
    }
    .nav-item:active { transform: scale(0.96); }
    .nav-icon svg { width: 24px; height: 24px; fill: currentColor; margin-bottom: 4px; }
    .nav-text { font-size: 11px; font-weight: 700; text-align: center; }
    

    /* ===== Кастомный график антихрупкости ===== */
    .af-root { width:100%; height:100%; display:flex; flex-direction:column;
               padding:10px 12px 8px; font-family:-apple-system, sans-serif; }
    .af-title { font-size:11px; font-weight:700; color:#111; text-align:center; margin-bottom:6px; }
    .af-plot { position:relative; flex:1; margin:14px 10px 34px; }
    .af-curve { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; z-index:3; }
    #af-bars { position:absolute; inset:0; }

    .af-bar { position:absolute; bottom:0; border:1px solid rgba(0,0,0,.55);
              border-radius:2px 2px 0 0; overflow:visible; }
    .af-inner { position:absolute; inset:0; overflow:hidden; border-radius:1px 1px 0 0; }
    .af-val { position:absolute; bottom:100%; left:0; width:100%; text-align:center;
              font-size:9px; font-weight:700; color:#000; margin-bottom:2px; z-index:6; }
    .af-cat { position:absolute; top:100%; left:50%; transform:translateX(-50%);
              margin-top:4px; font-size:8px; color:#333; white-space:nowrap; z-index:6; }
    .af-legend { display:flex; justify-content:center; gap:14px; font-size:7px;
                 font-weight:700; color:#333; background:rgba(255,255,255,.8);
                 border:1px solid #ccc; border-radius:4px; padding:3px 6px; align-self:center; }

    /* --- столбец "Обвал": тлеющие угли --- */
    .af-crash { background:linear-gradient(165deg,#3a1410 0%,#24100d 55%,#2e120f 100%); }
    .af-haze { position:absolute; bottom:-14px; left:-22%; width:144%; height:58px;
               background:radial-gradient(ellipse at center, rgba(255,150,40,.75) 0%,
                         rgba(255,100,20,.45) 40%, rgba(255,80,20,.15) 65%, rgba(255,80,20,0) 80%);
               filter:blur(7px); pointer-events:none; z-index:0;
               animation:afHaze 2.8s ease-in-out infinite; }
    @keyframes afHaze {
        0%,100% { transform:translateY(0) scale(1); opacity:.85; }
        50%     { transform:translateY(-9px) scale(1.12); opacity:1; }
    }
    .af-embers { position:absolute; bottom:0; left:0; width:100%; height:78%;
                 pointer-events:none; z-index:1;
                 -webkit-mask-image:linear-gradient(to top, #000 0%, #000 38%, rgba(0,0,0,.55) 62%, rgba(0,0,0,0) 100%);
                 mask-image:linear-gradient(to top, #000 0%, #000 38%, rgba(0,0,0,.55) 62%, rgba(0,0,0,0) 100%); }
    .af-embers::before { content:''; position:absolute; inset:0;
        background:radial-gradient(ellipse 85% 70% at 50% 100%, rgba(255,120,30,.6) 0%,
                  rgba(220,75,18,.34) 38%, rgba(160,45,12,.14) 62%, rgba(120,30,10,0) 85%);
        animation:afBed 2.1s ease-in-out infinite; }
    @keyframes afBed { 0%,100%{opacity:.75;} 50%{opacity:1;} }
    .af-crack { position:absolute; border-radius:40%; filter:blur(.4px);
        background:radial-gradient(ellipse at center,#fff2c0 0%,#ffb020 45%,rgba(255,110,20,0) 80%); }

    .af-flame { position:absolute; bottom:0; left:14%; width:12px; height:20px; }
    .af-f { position:absolute; bottom:0; left:50%; display:block;
            border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
            transform-origin:bottom center; }
    .af-f1 { width:9px;   height:16px;   margin-left:-4.5px;
             background:radial-gradient(ellipse at 50% 80%,#e6431a 0%,#b8280f 70%,rgba(184,40,15,0) 100%);
             animation:afFlick1 480ms ease-in-out infinite alternate; }
    .af-f2 { width:6px;   height:11.5px; margin-left:-3px;
             background:radial-gradient(ellipse at 50% 80%,#ffb020 0%,#ff7a1a 75%,rgba(255,122,26,0) 100%);
             animation:afFlick2 360ms ease-in-out infinite alternate; }
    .af-f3 { width:3.5px; height:7px;    margin-left:-1.75px;
             background:radial-gradient(ellipse at 50% 85%,#fff4c2 0%,#ffce54 70%,rgba(255,206,84,0) 100%);
             animation:afFlick3 260ms ease-in-out infinite alternate; }
    @keyframes afFlick1 {
        0%{transform:scaleY(1) scaleX(1) skewX(-2deg);opacity:.92;}
        50%{transform:scaleY(1.08) scaleX(.94) skewX(1deg) translateX(-1px);opacity:1;}
        100%{transform:scaleY(.95) scaleX(1.05) skewX(2deg) translateX(1px);opacity:.88;} }
    @keyframes afFlick2 {
        0%{transform:scaleY(1) skewX(2deg) translateX(.5px);opacity:.95;}
        50%{transform:scaleY(1.12) skewX(-2deg) translateX(-1px);opacity:1;}
        100%{transform:scaleY(.92) skewX(3deg) translateX(1px);opacity:.9;} }
    @keyframes afFlick3 {
        0%{transform:scaleY(1) skewX(-3deg);opacity:1;}
        50%{transform:scaleY(1.15) skewX(3deg) translateX(-.5px);opacity:.95;}
        100%{transform:scaleY(.9) skewX(-1deg) translateX(.5px);opacity:1;} }

    .af-tip { position:absolute; z-index:20; max-width:70%; padding:6px 9px;
              background:rgba(17,17,17,.92); color:#fff; font-size:10px; line-height:1.35;
              border-radius:8px; pointer-events:none; opacity:0; transform:translate(-50%,-6px);
              transition:opacity .18s ease, transform .18s ease; white-space:normal; }
    .af-tip.show { opacity:1; transform:translate(-50%,-10px); }
    .af-bar { cursor:pointer; }

    .af-sparks { position:absolute; bottom:0; left:0; width:100%; height:200px;
                 pointer-events:none; overflow:visible; z-index:2; }
    .af-spark { position:absolute; border-radius:50%; pointer-events:none; }

    /* --- столбец "Отлично": дыхание + мячик --- */
    .af-best { transform-origin:bottom center; overflow:visible;
               box-shadow:0 0 18px 4px rgba(34,197,94,.35);
               animation:afPulse 2.6s ease-in-out infinite, afBreathe 2.6s ease-in-out infinite; }
    @keyframes afPulse {
        0%,100% { box-shadow:0 0 18px 4px rgba(34,197,94,.35); }
        50%     { box-shadow:0 0 34px 10px rgba(34,197,94,.55); } }
    @keyframes afBreathe { 0%,100%{transform:scaleY(1);} 50%{transform:scaleY(1.035);} }
    .af-ball { position:absolute; left:0; bottom:0; width:8px; height:8px; border-radius:50%;
               background:radial-gradient(circle at 35% 30%,#fff9e0 0%,#ffe37a 55%,#f5c945 100%);
               box-shadow:0 0 6px rgba(255,227,122,.8); pointer-events:none; }

    }

    <script>
        (function initTelegram() {
            const tg = window.Telegram && window.Telegram.WebApp;
            if (!tg) return;
            tg.ready();
            tg.expand();
            if (tg.isVersionAtLeast && tg.isVersionAtLeast('8.0') && tg.requestFullscreen) {
                try { tg.requestFullscreen(); } catch (e) {}
            }
            if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
            document.documentElement.style.setProperty('--tg-bg', tg.themeParams.bg_color || '#f8f9fa');
            document.body.style.background = tg.themeParams.bg_color || '';
        })();

        let currentIdx = 0;
        const totalSlides = 4;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTick() {
            initAudio();
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(900, t);
            gain.gain.setValueAtTime(0.15, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.03);
            const tg = window.Telegram && window.Telegram.WebApp;
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            } else if (navigator.vibrate) {
                navigator.vibrate(10);
            }
        }

        function updateUI(index) {
            document.querySelectorAll('.nav-item').forEach((el, i) => el.classList.toggle('active', i === index));
            document.querySelectorAll('.slide').forEach((el, i) => el.classList.toggle('active', i === index));
            currentIdx = index;
        }

        document.querySelectorAll('.nav-item').forEach((item) => {
            item.addEventListener('click', () => {
                const idx = parseInt(item.getAttribute('data-index'));
                if (idx !== currentIdx) { updateUI(idx); playTick(); }
            });
        });

        const nav = document.getElementById('navZone');
        let startX = 0, lastX = 0, isDragging = false;
        const STEP = 40;

        nav.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = lastX = e.touches[0].clientX;
        }, {passive: true});

        nav.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const curr = e.touches[0].clientX;
            const diff = curr - lastX;

            if (Math.abs(diff) > STEP) {
                if (diff > 0 && currentIdx < totalSlides - 1) {
                    updateUI(currentIdx + 1); playTick();
                } else if (diff < 0 && currentIdx > 0) {
                    updateUI(currentIdx - 1); playTick();
                }
                lastX = curr;
            }
        }, {passive: true});

        nav.addEventListener('touchend', () => { isDragging = false; });
    </script>

    const lastDateObj = new Date(WF_DATES[WF_DATES.length - 1]);
    // Сдвигаем красный столбец на +20 дней относительно последней выплаты
    const totalBarDate = new Date(lastDateObj.getTime() + (80 * 24 * 60 * 60 * 1000));
    
    // Ширина столбца: ~2 недели в миллисекундах (1.2e9 ms). 
    // Это сделает их тонкими и аккуратными независимо от масштаба.
    const barWidth = 4.8e9; 

    // Строим waterfall
    Plotly.newPlot('dividends_waterfall', [
        {
            // Зеленые столбцы
            x: WF_DATES,
            y: WF_AMOUNTS,
            type: 'waterfall',  
            name: 'Дивиденды',
            //marker: {color: '#22c55e'},
            increasing: { marker: { color: '#22c55e' } },
            decreasing: { marker: { color: '#22c55e' } },
            hoverinfo: 'y',
            hovertemplate: '%{x|%d.%m.%Y}<br>Дивиденд: %{delta:.2f}<extra></extra>',
            width: barWidth, // Фиксируем ширину!
            connector: {
                line: {color: '#22c55e', dash: 'dash', width: 2}
            },
            text: WF_AMOUNTS.map(v => v.toFixed(2)),
            textposition: 'inside',
            textfont: {size: 20, cliponaxis: false, color: '#000',family: 'Arial Black, sans-serif'}
        },
        {
            // Красный столбец (Итог)
            x: [totalBarDate.toISOString().split('T')[0]], // Дата со сдвигом
            y: [WF_TOTAL],
            type: 'bar',
            name: 'Итоговая сумма',
            marker: {color: '#b91c1c'},
            hoverinfo: 'y',
            hovertemplate: '%{x|%d.%m.%Y}<br>Всего: %{y:.2f}<extra></extra>',
            width: barWidth, // Та же ширина
            text: [WF_TOTAL.toFixed(2)],
            textposition: 'inside',
            textfont: {size: 20, cliponaxis: false, color: '#000',family: 'Arial Black, sans-serif'}
        }
    ], {
        title: {text: 'Накопленные дивиденды SBER', font: {size: 14}, y: 1},
        margin: {l: 50, r: 20, t: 40, b: 20}, // Уменьшил отступ снизу, так как легенда внешняя
        
        xaxis: {
            type: 'date', // Ось времени
            tickfont: {size: 8},
            gridcolor: '#eee'
        },
        
        yaxis: {gridcolor: '#eee', tickfont: {size: 10}},
        
        legend: {
            orientation: 'h',
            y: -0.15,
            x: 0.5,
            xanchor: 'center',
            font: {size: 8, weight: '700'}
        },
        hovermode: 'x',
        dragmode: false
    }, {
        responsive: true,
        displayModeBar: false,
        scrollZoom: true,
        doubleClick: false
    });
   
</script>

const COLORS = ['#8b0000', '#ff0000', '#ffd700', '#90ee90', '#008000'];

    const bar = document.createElement('div');
    bar.className = 'af-bar' + (isCrash ? ' af-crash' : '') + (isBest ? ' af-best' : '');

        '</div>';

    bar.dataset.tip = HOVER_TEXTS[i];

const EMBER_COLORS = ['#fff4c2', '#ffce54', '#ff9d2e', '#ff6a1a', '#e6431a'];
let sparkTimer = null;

function spawnSpark() {
    const zw = sparkZone.clientWidth || 70;
    const spark = document.createElement('div');
    spark.className = 'af-spark';
    const size = 2 + Math.random() * 3;
    const color = EMBER_COLORS[(Math.random() * EMBER_COLORS.length) | 0];
    spark.style.cssText = 'width:' + size + 'px;height:' + size + 'px;left:' +
        (Math.random() * zw) + 'px;bottom:' +
        Math.max(0, 15 + (Math.random() * Math.random() * 60 - 15)) + 'px;background:' + color +
        ';box-shadow:0 0 ' + (size * 2) + 'px ' + color;
    sparkZone.appendChild(spark);

    const angle = -90 + (Math.random() * 75 - 37.5);
    const dist = 40 + Math.random() * 70;
    const rad = angle * Math.PI / 180;
    const dx = Math.cos(rad) * dist * 0.525;
    const dy = Math.sin(rad) * dist * 1.25;
    const wob = Math.random() * 18 - 9;
    const dur = (380 + Math.random() * 420) * 1.53;

    spark.animate([
        { transform: 'translate(0,0) scale(1)', opacity: 1, offset: 0 },
        { transform: 'translate(' + (dx*0.5 + wob) + 'px,' + (dy*0.6) + 'px) scale(0.7)', opacity: 0.85, offset: 0.5 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(0.2)', opacity: 0, offset: 1 }
    ], { duration: dur, easing: 'ease-out' });
    setTimeout(() => spark.remove(), dur);
}

// ---- мячик в столбце "Отлично" ----
const ball = barsHost.querySelector('.af-ball');
const BALL = 8, MIN_SPD = 0.42, MAX_SPD = 1.0;
let bx = 4, by = 12, rafId = null;
let bvx = (Math.random() < 0.5 ? -1 : 1) * (0.77 + Math.random() * 0.42);
let bvy = (Math.random() < 0.5 ? -1 : 1) * (0.77 + Math.random() * 0.42);

function randomBounce(axis) {
    let spd = Math.hypot(bvx, bvy);
    let ang = Math.atan2(bvy, bvx) + (Math.random() * 0.7 - 0.35);
    spd = Math.min(MAX_SPD, Math.max(MIN_SPD, spd * (0.8 + Math.random() * 0.35)));
    let nvx = Math.cos(ang) * spd, nvy = Math.sin(ang) * spd;
    if (axis === 'x' && Math.sign(nvx) !== Math.sign(bvx)) nvx = -nvx;
    if (axis === 'y' && Math.sign(nvy) !== Math.sign(bvy)) nvy = -nvy;
    bvx = nvx; bvy = nvy;
}

function stepBall() {
    const host = ball.parentElement;
    const w = host.clientWidth - BALL, h = host.clientHeight - BALL;
    bx += bvx; by += bvy;
    if (bx <= 0)  { bx = 0; bvx = Math.abs(bvx); randomBounce('x'); }
    if (bx >= w)  { bx = w; bvx = -Math.abs(bvx); randomBounce('x'); }
    if (by <= 0)  { by = 0; bvy = Math.abs(bvy); randomBounce('y'); }
    if (by >= h)  { by = h; bvy = -Math.abs(bvy); randomBounce('y'); }
    ball.style.transform = 'translate(' + bx.toFixed(1) + 'px,' + (-by).toFixed(1) + 'px)';
    rafId = requestAnimationFrame(stepBall);
}

function showTip(bar) {
    clearTimeout(tipTimer);
    tip.textContent = bar.dataset.tip;
    const pr = plotEl.getBoundingClientRect();
    const br = bar.getBoundingClientRect();
    let left = br.left - pr.left + br.width / 2;
    left = Math.min(Math.max(left, pr.width * 0.18), pr.width * 0.82);
    tip.style.left = left + 'px';
    tip.style.top = Math.max(0, br.top - pr.top - 12) + 'px';
    tip.classList.add('show');
    tipTimer = setTimeout(() => tip.classList.remove('show'), 2600);
}

barsHost.querySelectorAll('.af-bar').forEach(bar => {
    bar.removeAttribute('title');
    bar.addEventListener('click', e => { e.stopPropagation(); showTip(bar); });
});
plotEl.addEventListener('click', () => tip.classList.remove('show'));

// ---- запуск/остановка анимаций только когда слайд виден ----
const afSlide = host.closest('.slide');
function afStart() {
    if (!sparkTimer) sparkTimer = setInterval(spawnSpark, 55);
    if (!rafId) rafId = requestAnimationFrame(stepBall);
}
function afStop() {
    clearInterval(sparkTimer); sparkTimer = null;
    cancelAnimationFrame(rafId); rafId = null;
    sparkZone.innerHTML = '';
}
new MutationObserver(() => {
    afSlide.classList.contains('active') ? afStart() : afStop();
}).observe(afSlide, { attributes: true, attributeFilter: ['class'] });
